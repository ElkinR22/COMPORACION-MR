<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Financiero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Dashboard</a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light">Cerrar Sesión <i class="fas fa-sign-out-alt"></i></a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4">Resumen Financiero</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-header">Ingresos</div>
                    <div class="card-body">
                        <h5 class="card-title">$5,000</h5>
                        <p class="card-text">Este mes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-danger mb-3">
                    <div class="card-header">Gastos</div>
                    <div class="card-body">
                        <h5 class="card-title">$2,500</h5>
                        <p class="card-text">Este mes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info mb-3">
                    <div class="card-header">Balance</div>
                    <div class="card-body">
                        <h5 class="card-title">$2,500</h5>
                        <p class="card-text">Este mes</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-5">
            <h2>Actividad Reciente</h2>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2024-07-28</td>
                        <td>Salario</td>
                        <td class="text-success">+$5,000</td>
                    </tr>
                    <tr>
                        <td>2024-07-28</td>
                        <td>Alquiler</td>
                        <td class="text-danger">-$1,500</td>
                    </tr>
                    <tr>
                        <td>2024-07-27</td>
                        <td>Supermercado</td>
                        <td class="text-danger">-$300</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>&copy; 2024 Sistema Financiero Personal</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
